# Diana — Spotline proxy.
#
# This file is public, and that is fine: it contains no secret. The WWFF API key
# lives only in Cloudflare, put there once with `wrangler secret put
# WWFF_API_KEY`, and is readable by nothing and nobody afterwards — not the
# dashboard, not wrangler, not this repository. The code sees it as
# env.WWFF_API_KEY at run time and never writes it anywhere.
#
# FIRST TIME? See README.md in this directory. Two things must exist before
# `wrangler deploy` will work: the KV namespace below, and the secret.

name = "diana-spotline"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Keep the Worker off a public *.workers.dev address until the rate limiting of
# step 2.6 has actually been tested. Flip this to true when you want the app to
# be able to reach it.
workers_dev = true

[vars]
# Which Spotline to talk to. This is production: spots sent through Diana land
# on the real network. Moving back to the development host is this one line
# plus a deploy — which is exactly why it is a variable and not a constant in
# the code, and it is the first thing to try if something looks wrong:
#
#   WWFF_BASE = "https://spots-dev.cuf.fi"     # validates, stores nothing
#
# The development host is also where "dryrun": true was proven; that flag keeps
# working here, and the app's "Check" button uses it for exactly that reason.
# The dev host was, at the time we tested it, running an older release and
# answering 404 on this same agenda path — confirmed with WWFF (Jouni OH3CUF,
# 2026-09-09) to be their side, not ours.
WWFF_BASE = "https://spots.wwff.co"

# The paths on that host. Configuration rather than constants, because the
# documentation and the live router have already disagreed once: WWFF's own
# published docs say POST /api/agenda/store, but production actually routes
# agenda submissions at /api/agendas/add (confirmed by WWFF, Jouni OH3CUF,
# 2026-09-09 — their documentation is wrong, not this Worker). If this ever
# 404s again, that is a question for WWFF before it is a code change here.
SPOT_PATH = "/api/spots/add"
AGENDA_PATH = "/api/agendas/add"

# Browsers may call this Worker from these origins, comma-separated, no spaces.
# Outside a browser an Origin header is trivially forged, so this is a doorstep
# and not a lock. The lock is the rate limiting.
ALLOWED_ORIGINS = "https://diana-onff.github.io,http://localhost:8011"

# Rate limits. Deliberately far below WWFF's own (~100/min, 1000/hour per key):
# the budget is shared with every other Spotline user, so Diana running into its
# own ceiling is a nuisance, while Diana emptying the shared one is everybody's
# problem.
# Eight, not five, and the reason is the two-step flow in the app: checking a
# spot and then sending it are two requests, so five would give one activator
# only two attempts per ten minutes. Eight leaves four — still nothing against
# WWFF's own ceiling, and enough that nobody meets this limit by using the app
# the way it is meant to be used.
LIMIT_IP_SPOTS = "16"          # per IP address, per window below
LIMIT_IP_WINDOW = "600"       # seconds — ten minutes
LIMIT_IP_AGENDA = "10"        # per IP address per day
LIMIT_GLOBAL_MINUTE = "40"    # Diana as a whole, per minute

# A second, independent net under LIMIT_GLOBAL_MINUTE: well below Cloudflare's
# own free-tier ceiling of 100,000 requests a day, so a warning arrives with
# room to react instead of on the same request that hits the real wall. At
# 40/minute the minute limit above already keeps a full day of accepted
# traffic near 57,600 — under this number on its own — so in normal operation
# this should never fire. It exists for the day something upstream of it
# changes and nobody thought to revisit this file too.
LIMIT_GLOBAL_DAY = "90000"

# Upstream timeout in milliseconds. A user staring at a spinner is worse than an
# honest error, and a hanging request holds a rate-limit slot for nothing.
UPSTREAM_TIMEOUT_MS = "8000"

# Counters and the kill switch.
#
# This id is not a secret and belongs in the repository: it is a reference, not
# a key, and does nothing without a token for this Cloudflare account. Having it
# here is what lets the next person deploy without hunting for it.
#
# Setting up a SEPARATE instance (a fork, a second account) means making your own:
#   wrangler kv namespace create DIANA_KV
# and replacing the id below with the one it prints. Wrangler shows it as a JSON
# snippet; this file is TOML, so copy only the id string.
#
# Mind KV's own free-tier ceiling: 1000 writes per day. Only requests that pass
# validation and actually go to WWFF write anything, so a preflight, a rejected
# form or a blocked origin costs nothing.
[[kv_namespaces]]
binding = "DIANA_KV"
id = "91c24f089f504da0af67499b40cc7ebb"
