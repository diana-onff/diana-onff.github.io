name: Publish to GitHub Pages

# Everything inside GitHub. No external service.
#
#   push to main             → the live site
#   pull request             → a preview at .../preview/pr-<number>/
#   pull request closed      → that preview is cleaned up
#   manually (Run workflow)  → the same as a push, handy for the first time
#
# The preview is the reason this publishes to a gh-pages branch instead of going
# through the standard Pages action: without a preview, "merge" is a leap in the dark.
#
# SET THIS FIRST, or the push fails with a 403:
#   Settings → Actions → General → Workflow permissions → "Read and write permissions"
#
# AFTER THAT, only once this workflow has run green a single time:
#   Settings → Pages → Source "Deploy from a branch" → branch "gh-pages", folder "/ (root)"

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # Load-bearing, not decorative: a push made with the default GITHUB_TOKEN does
  # not start new workflows. Without this trigger the commit from "Build map data"
  # does land on main but is never published, and the preview of a pull request
  # shows the dataset from before the conversion.
  #
  # The name below must match the `name:` at the top of build-data.yml exactly —
  # GitHub matches on that string and says nothing at all when it does not fit.
  # It read "Build ONFF data" long after that workflow had been renamed for more
  # than one country, so this trigger had quietly not fired since: every nightly
  # refresh landed on main and stayed unpublished.
  workflow_run:
    workflows: ["Build map data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A failed data build must publish nothing — the previous site then stays up.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # On workflow_run we have to take the branch that build ran on, otherwise
      # we publish the code from before its commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Install the Python dependencies
        run: pip install -r build/requirements.txt

      - name: Assemble the site (without source/)
        if: github.event.action != 'closed'
        run: |
          bash build/site.sh _site
          test -f _site/index.html || { echo "::error::_site/index.html is missing"; exit 1; }

      - name: Determine the destination
        id: dest
        run: |
          # "." is the live site. Only main/master may end up there — an unknown
          # branch gets an empty destination and publishes nothing; better
          # nothing at all than overwriting the live site with a side branch.
          case "${{ github.event_name }}" in
            pull_request)
              echo "path=preview/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              PR="${{ github.event.workflow_run.pull_requests[0].number }}"
              BR="${{ github.event.workflow_run.head_branch }}"
              if [ -n "$PR" ]; then
                echo "path=preview/pr-$PR" >> "$GITHUB_OUTPUT"
              elif [ "$BR" = "main" ] || [ "$BR" = "master" ]; then
                echo "path=." >> "$GITHUB_OUTPUT"
              else
                echo "path=" >> "$GITHUB_OUTPUT"
                echo "::notice::branch '$BR' does not belong to a pull request and is not main — nothing published"
              fi
              ;;
            *)
              echo "path=." >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Fetch the existing gh-pages
        id: fetch
        continue-on-error: true          # the first time round that branch does not exist yet
        run: |
          git clone --depth=1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .pages

      - name: Create gh-pages for the first time
        if: steps.fetch.outcome != 'success'
        run: |
          echo "gh-pages did not exist yet — new branch."
          rm -rf .pages && mkdir .pages
          cd .pages
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Put the site in place
        if: github.event.action != 'closed' && steps.dest.outputs.path != ''
        run: |
          DEST=".pages/${{ steps.dest.outputs.path }}"
          if [ "${{ steps.dest.outputs.path }}" = "." ]; then
            # replace the live site, but leave the previews alone
            find .pages -mindepth 1 -maxdepth 1 ! -name preview ! -name .git -exec rm -rf {} +
          else
            rm -rf "$DEST"
          fi
          mkdir -p "$DEST"
          cp -r _site/. "$DEST/"
          touch .pages/.nojekyll     # otherwise Pages ignores folders starting with _

      - name: Clean up the preview when a pull request is closed
        if: github.event.action == 'closed'
        run: rm -rf ".pages/preview/pr-${{ github.event.pull_request.number }}"

      - name: Publish
        if: steps.dest.outputs.path != ''
        run: |
          cd .pages
          git config user.name  "diana-bot"
          git config user.email "diana-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to publish."
            exit 0
          fi
          git commit -q -m "publish: ${{ steps.dest.outputs.path }} (${GITHUB_SHA::7})"
          git push -q origin gh-pages
          echo "Published to gh-pages: ${{ steps.dest.outputs.path }}"

      - name: Where it is now
        if: github.event.action != 'closed' && steps.dest.outputs.path != ''
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE="$(bash build/paginabasis.sh "$OWNER" "$REPO")"
          if [ "${{ steps.dest.outputs.path }}" = "." ]; then
            echo "### 🗺️ Live site: ${BASE}/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🗺️ Preview: ${BASE}/${{ steps.dest.outputs.path }}/" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Is Pages still switched off? Settings → Pages → branch \`gh-pages\`, folder \`/ (root)\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Post the preview link on the pull request
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE="$(bash build/paginabasis.sh "$OWNER" "$REPO")"
          URL="${BASE}/preview/pr-${{ github.event.pull_request.number }}/"
          MARKER="<!-- diana-preview -->"
          BODY="${MARKER}
          ### 🗺️ Preview of this change

          ${URL}

          Look at the map before you merge. Pages needs a minute or two."
          ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                 --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$BODY" >/dev/null
          fi
